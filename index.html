<!DOCTYPE html>

<body>
<div id="root"></div>
<script>
const { useState, useMemo, useEffect, useRef } = React;
const h = React.createElement;

// ---------- Física (modelo de Prusa, 2000) ----------
const G = 9.81, RHOW = 1000, RHOA = 1.2, PATM = 101325, GAM = 1.4;

function simulate(p) {
  const Ab = Math.PI * (p.D / 2) ** 2;       // sección de la botella
  const Ae = Math.PI * (p.de / 2) ** 2;      // sección de la boquilla
  const Vb = p.Vb, Vw0 = Math.min(p.Vw, 0.95 * Vb);
  const Va0 = Vb - Vw0;                       // volumen inicial de aire
  const P0 = PATM + p.P0 * 1000;              // presión absoluta inicial
  const th = p.theta * Math.PI / 180;
  const k = 1 - (Ae / Ab) ** 2;
  let x = 0, y = 0, vx = 0, vy = 0, Vw = Vw0, t = 0, launched = false;
  let hmax = 0, tApex = 0, vmax = 0, Fmax = 0, tBurn = null, ve0 = 0, apex = { x: 0, y: 0 };
  const pts = []; let lastPush = -1, impact = false;
  const ve_init = Math.sqrt(2 * (P0 - PATM) / (RHOW * k));
  ve0 = ve_init;
  while (t < 120) {
    let thrust = 0;
    const dt = Vw > 0 ? 0.0005 : 0.002;
    if (Vw > 0) {
      const P = P0 * Math.pow(Va0 / (Vb - Vw), GAM);        // expansión adiabática del aire
      if (P > PATM) {
        const ve = Math.sqrt(2 * (P - PATM) / (RHOW * k));  // Bernoulli
        thrust = RHOW * Ae * ve * ve;                       // empuje = flujo másico * ve
        Vw -= Ae * ve * dt;                                 // conservación de la masa
      } else Vw = 0;
      if (Vw <= 0) { Vw = 0; tBurn = t; }
    }
    const m = p.m + RHOW * Vw;
    const v = Math.hypot(vx, vy);
    const dx = v > 0.3 ? vx / v : Math.cos(th), dy = v > 0.3 ? vy / v : Math.sin(th);
    const drag = 0.5 * RHOA * p.cd * Math.PI * (p.Dc / 2) ** 2 * v * v;   // arrastre con Ac
    let ax = (thrust - drag) * dx / m, ay = (thrust - drag) * dy / m - G;
    if (!launched && ay <= 0) {            // el cohete aún no despega
      if (Vw <= 0) break;
      vx = vy = 0; ax = ay = 0;
    }
    vx += ax * dt; vy += ay * dt; x += vx * dt; const yPrev = y; y += vy * dt; t += dt;
    if (y > 0) launched = true;
    if (launched && y < 0) {               // impacto: interpolar
      const f = yPrev / (yPrev - y); x -= vx * dt * (1 - f); y = 0; t -= dt * (1 - f); impact = true;
    }
    if (y > hmax) { hmax = y; tApex = t; apex = { x, y }; }
    vmax = Math.max(vmax, Math.hypot(vx, vy)); Fmax = Math.max(Fmax, thrust);
    if (t - lastPush >= (Vw > 0 ? 0.002 : 0.02) || impact) { pts.push({ t, x, y, burn: Vw > 0, v: Math.hypot(vx, vy), T: thrust }); lastPush = t; }
    if (impact) break;
  }
  const last = pts[pts.length - 1] || { t: 0, x: 0, y: 0 };
  const burnPt = tBurn !== null ? pts.find(q => q.t >= tBurn) : null;
  return { pts, hmax, tApex, tFlight: last.t, range: last.x, vmax, Fmax, tBurn: tBurn || 0, ve0, apex, burnPt, Vw0, clamped: p.Vw > 0.95 * Vb };
}

// ---------- UI ----------
function Slider({ label, unit, v, min, max, set }) {

  const commit = () => { if (draft === null) return; const n = parseFloat(draft); if (isFinite(n)) set(Math.min(max, Math.max(min, Math.round(n * 100) / 100))); setDraft(null); };
  return h('div', { className: 'block mb-3' },
    h('div', { className: 'flex items-center justify-between gap-2 text-sm mb-1' },
      h('span', { className: 'text-slate-300' }, label),
      h('span', { className: 'flex items-center gap-1' },
        h('input', { type: 'number', step: '0.01', min, max, value: shown, onChange: onType, onBlur: commit,
          onKeyDown: e => { if (e.key === 'Enter') e.target.blur(); },
          className: 'mono w-20 rounded bg-slate-800 border border-slate-600 px-1.5 py-0.5 text-right text-sky-300 focus:outline-none focus:ring-1 focus:ring-sky-400' }),

}
function Group({ title, color, children }) {

    h('h3', { className: 'font-bold mb-3', style: { color } }, title), children);
}
function Stat({ label, value, unit, color }) {

    h('div', { className: 'text-xs text-slate-400' }, label),
    h('div', { className: 'mono text-2xl font-bold', style: { color } }, value, h('span', { className: 'text-sm ml-1 text-slate-400' }, unit)));
}
function niceStep(r) { const e = Math.pow(10, Math.floor(Math.log10(r))); const f = r / e; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e; }

function Chart({ r, tAnim, clk, theta }) {

  const pw = W - L - R, ph = H - T - B;

  const s = Math.min(pw / xmax, ph / ymax);
  const X = x => L + x * s, Y = y => H - B - y * s;
  const stepX = niceStep(Math.min(pw / s, 400) / 6), stepY = niceStep(Math.min(ph / s, 400) / 5);
  const ticksX = [], ticksY = [];
  for (let v = 0; v * s <= pw; v += stepX) ticksX.push(v);
  for (let v = 0; v * s <= ph; v += stepY) ticksY.push(v);
  const burnPts = r.pts.filter(q => q.burn), coastPts = r.pts.filter((q, i) => !q.burn || i === r.pts.findIndex(z => !z.burn));
  const path = a => a.map((q, i) => (i ? 'L' : 'M') + X(q.x).toFixed(1) + ' ' + Y(q.y).toFixed(1)).join('');
  let rocket = null, burning = false;
  if (r.pts.length) {
    const n = r.pts.length;
    let i = tAnim === null ? 0 : r.pts.findIndex(z => z.t >= tAnim); if (i < 0) i = n - 1;
    const a = r.pts[Math.max(0, i - 3)], b = r.pts[Math.min(n - 1, i + 3)];
    const dx = (b.x - a.x) * s, dy = -(b.y - a.y) * s;
    const ang = Math.abs(dx) + Math.abs(dy) < 1e-6 ? -theta : Math.atan2(dy, dx) * 180 / Math.PI;

    const ph = (clk * 2.2 + k / 18) % 1, sp = ((k * 7) % 11) / 11 - 0.5;
    drops.push(h('circle', { key: k, cx: -15 - ph * 36, cy: sp * ph * 22, r: 3.4 * (1 - ph) + 0.8, fill: k % 3 ? '#38bdf8' : '#bae6fd', opacity: 0.9 * (1 - ph) }));
  }

  return h('svg', { viewBox: `0 0 ${W} ${H}`, className: 'w-full rounded-xl', style: { background: 'linear-gradient(#10304f,#0b1a2b 85%)' } },
    ticksY.map(v => h('g', { key: 'y' + v },
      h('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: '#1e3a5a', strokeWidth: 1 }),
      h('text', { x: L - 8, y: Y(v) + 4, fill: '#8fa9c4', fontSize: 11, textAnchor: 'end' }, v))),
    ticksX.map(v => h('g', { key: 'x' + v },
      h('line', { x1: X(v), x2: X(v), y1: T, y2: H - B, stroke: '#1e3a5a', strokeWidth: 1 }),
      h('text', { x: X(v), y: H - B + 16, fill: '#8fa9c4', fontSize: 11, textAnchor: 'middle' }, v))),
    h('text', { x: W / 2, y: H - 6, fill: '#8fa9c4', fontSize: 12, textAnchor: 'middle' }, 'Distancia horizontal (m)'),
    h('text', { x: 14, y: H / 2, fill: '#8fa9c4', fontSize: 12, textAnchor: 'middle', transform: `rotate(-90 14 ${H / 2})` }, 'Altura (m)'),
    h('rect', { x: L, y: H - B, width: pw, height: 3, fill: '#4d7c3a' }),
    h('path', { d: path(coastPts), fill: 'none', stroke: '#38bdf8', strokeWidth: 2.5 }),
    h('path', { d: path(burnPts), fill: 'none', stroke: '#fb923c', strokeWidth: 4 }),
    // altura máxima
    h('line', { x1: X(r.apex.x), x2: X(r.apex.x), y1: Y(r.apex.y), y2: Y(0), stroke: '#facc15', strokeDasharray: '4 4' }),
    h('circle', { cx: X(r.apex.x), cy: Y(r.apex.y), r: 6, fill: '#facc15' }),
    h('text', { x: X(r.apex.x) + (flip ? -10 : 10), y: Y(r.apex.y) - 10, fill: '#facc15', fontSize: 13, fontWeight: 700, textAnchor: flip ? 'end' : 'start' }, `Altura máxima: ${r.hmax.toFixed(1)} m`),
    // alcance
    h('circle', { cx: X(r.range), cy: Y(0), r: 6, fill: '#f87171' }),
    h('text', { x: Math.min(X(r.range), W - R - 4), y: Y(0) - 12, fill: '#f87171', fontSize: 13, fontWeight: 700, textAnchor: r.range * s > pw * 0.8 ? 'end' : 'middle' }, `Distancia de vuelo: ${r.range.toFixed(1)} m`),
    r.burnPt && h('g', null,
      h('circle', { cx: X(r.burnPt.x), cy: Y(r.burnPt.y), r: 4, fill: '#fb923c' }),
      h('text', { x: X(r.burnPt.x) + 8, y: Y(r.burnPt.y) + 16, fill: '#fdba74', fontSize: 11 }, 'Fin del empuje')),
    rocket && h('g', { transform: `translate(${X(rocket.x)} ${Y(rocket.y)}) rotate(${rocket.ang}) scale(1.3)` },
      drops,
      h('path', { d: 'M-6 -4 L-14 -11 L-14 -4Z', fill: '#ef4444' }),
      h('path', { d: 'M-6 4 L-14 11 L-14 4Z', fill: '#ef4444' }),
      h('path', { d: 'M18 0 C10 -6 -8 -6 -14 -4 L-14 4 C-8 6 10 6 18 0Z', fill: '#e2e8f0', stroke: '#94a3b8', strokeWidth: 0.8 }),
      h('path', { d: 'M18 0 C14 -3 10 -4 8 -4.5 L8 4.5 C10 4 14 3 18 0Z', fill: '#ef4444' }),
      h('circle', { cx: 0, cy: 0, r: 2.3, fill: '#38bdf8', stroke: '#475569', strokeWidth: 0.8 })),
    h('g', { transform: `translate(${W - R - 150} ${T + 6})` },
      h('rect', { width: 150, height: 44, rx: 6, fill: '#0b1a2b', opacity: 0.8 }),
      h('line', { x1: 10, x2: 34, y1: 14, y2: 14, stroke: '#fb923c', strokeWidth: 4 }),
      h('text', { x: 40, y: 18, fill: '#e6eef7', fontSize: 11 }, 'Propulsión (agua)'),
      h('line', { x1: 10, x2: 34, y1: 32, y2: 32, stroke: '#38bdf8', strokeWidth: 3 }),
      h('text', { x: 40, y: 36, fill: '#e6eef7', fontSize: 11 }, 'Vuelo libre y caída')));
}

const DEF = { Vw: 0.7, P0: 300, Vb: 2.0, m: 0.15, D: 0.09, Dc: 0.09, de: 0.022, cd: 0.4, theta: 60 };
const toSim = q => ({ ...q, Vw: q.Vw * 0.001, Vb: q.Vb * 0.001 });
const VARS = [
  { k: 'P0', label: 'Presión inicial', unit: 'kPa', min: 100, max: 400, f: 1 },
  { k: 'Vw', label: 'Volumen de agua', unit: 'L', min: 0.1, max: 2.0, f: 1 },
  { k: 'theta', label: 'Ángulo de lanzamiento', unit: '°', min: 10, max: 90, f: 1 },
  { k: 'de', label: 'Diámetro de la boquilla', unit: 'mm', min: 0.005, max: 0.03, f: 1000 },
  { k: 'm', label: 'Masa seca', unit: 'kg', min: 0.05, max: 0.6, f: 1 },
  { k: 'Vb', label: 'Volumen total de la botella', unit: 'L', min: 1, max: 3, f: 1 },
  { k: 'Dc', label: 'Diámetro del cohete (Ac)', unit: 'mm', min: 0.04, max: 0.15, f: 1000 },
  { k: 'cd', label: 'Coeficiente de arrastre', unit: '', min: 0.2, max: 0.9, f: 1 }];
const OUTS = [{ k: 'hmax', label: 'Altura máxima', unit: 'm' }, { k: 'range', label: 'Distancia de vuelo', unit: 'm' }, { k: 'vmax', label: 'Velocidad máxima', unit: 'm/s' }];
const tick0 = () => new Promise(res => setTimeout(res, 0));
const fmt = v => Number(v.toPrecision(3));
const selCls = 'rounded bg-slate-800 border border-slate-600 px-2 py-1 text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-sky-400';

function Plot({ data, color, xl, yl, dots, cursor, H = 200 }) {
  const W = 400, L = 46, B = 30, T = 10, R = 12;
  if (!data.length) return h('div', { className: 'text-slate-500 text-sm p-8 text-center' }, 'Sin datos todavía');
  const xs = data.map(d => d.x), ys = data.map(d => d.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(0, ...ys), y1 = Math.max(...ys, 1e-9) * 1.1;
  const X = x => L + (x - x0) / ((x1 - x0) || 1) * (W - L - R), Y = y => H - B - (y - y0) / ((y1 - y0) || 1) * (H - B - T);
  const tk = [0, 1, 2, 3, 4];
  return h('svg', { viewBox: `0 0 ${W} ${H}`, className: 'w-full' },
    tk.map(i => { const yv = y0 + (y1 - y0) * i / 4, xv = x0 + (x1 - x0) * i / 4; return h('g', { key: i },
      h('line', { x1: L, x2: W - R, y1: Y(yv), y2: Y(yv), stroke: '#1e3a5a' }),
      h('text', { x: L - 6, y: Y(yv) + 3, fill: '#8fa9c4', fontSize: 10, textAnchor: 'end' }, fmt(yv)),
      h('text', { x: X(xv), y: H - B + 13, fill: '#8fa9c4', fontSize: 10, textAnchor: 'middle' }, fmt(xv))); }),
    h('text', { x: (L + W - R) / 2, y: H - 3, fill: '#8fa9c4', fontSize: 10, textAnchor: 'middle' }, xl),
    h('text', { x: 10, y: H / 2, fill: '#8fa9c4', fontSize: 10, textAnchor: 'middle', transform: `rotate(-90 10 ${H / 2})` }, yl),
    h('path', { d: data.map((d, i) => (i ? 'L' : 'M') + X(d.x).toFixed(1) + ' ' + Y(d.y).toFixed(1)).join(''), fill: 'none', stroke: color, strokeWidth: 2 }),
    dots && data.map((d, i) => h('circle', { key: i, cx: X(d.x), cy: Y(d.y), r: 3.5, fill: color })),
    cursor != null && cursor >= x0 && cursor <= x1 && h('line', { x1: X(cursor), x2: X(cursor), y1: T, y2: H - B, stroke: '#facc15', strokeDasharray: '3 3' }));
}

function App() {
  const [p, setP] = useState(DEF);
  const [swVar, setSwVar] = useState('P0'), [swOut, setSwOut] = useState('hmax'), [sw, setSw] = useState(null), [swBusy, setSwBusy] = useState(false);
  const [obj, setObj] = useState('hmax'), [iters, setIters] = useState(100), [best, setBest] = useState(null), [opBusy, setOpBusy] = useState(false), [prog, setProg] = useState(0);
  const [tAnim, setTAnim] = useState(null);

    const tick = now => {

      const t = real < realBurn ? real / realBurn * tb : tb + (real - realBurn) * speed;
      setClk(real);

    };
    raf.current = requestAnimationFrame(tick);
  };
  const f = (v, d = 2) => v.toFixed(d);
  const reset = () => { cancelAnimationFrame(raf.current); setP(DEF); setTAnim(null); };
  const runSweep = async () => {
    setSwBusy(true); const v = VARS.find(a => a.k === swVar), o = OUTS.find(a => a.k === swOut), N = 30, out = [];

      const val = v.min + (v.max - v.min) * i / (N - 1);
      out.push({ x: val * v.f, y: simulate(toSim({ ...p, [v.k]: val }))[o.k] });
      if (i % 6 === 5) { setSw({ v, o, data: [...out] }); await tick0(); }
    }

  };

  };
  const applyBest = () => { setP(o => ({ ...o, ...best.c })); setTAnim(null); };

  const expCard = h(Group, { title: 'Modo Experimento', color: '#c4b5fd' },
    h('p', { className: 'text-sm text-slate-400 mb-3' }, 'Cambia una sola variable de entrada en todo su rango (30 pasos) y grafica la salida elegida. Las demás variables se mantienen constantes en sus valores actuales.'),
    h('div', { className: 'flex flex-wrap gap-2 mb-3' },
      h('select', { className: selCls, value: swVar, onChange: e => { setSwVar(e.target.value); setSw(null); } }, VARS.map(v => h('option', { key: v.k, value: v.k }, v.label))),
      h('select', { className: selCls, value: swOut, onChange: e => { setSwOut(e.target.value); setSw(null); } }, OUTS.map(o => h('option', { key: o.k, value: o.k }, o.label))),
      h('button', { onClick: runSweep, disabled: swBusy, className: btn + ' bg-violet-500 hover:bg-violet-400 text-slate-900' }, swBusy ? 'Calculando…' : 'Ejecutar barrido')),
    sw ? h(Plot, { data: sw.data, color: '#c4b5fd', dots: true, H: 230, xl: `${sw.v.label} (${sw.v.unit})`, yl: `${sw.o.label} (${sw.o.unit})` }) : h('div', { className: 'text-slate-500 text-sm py-10 text-center' }, 'Elige una variable y ejecuta el barrido.'));
  const bl = best && [['Presión', f(best.c.P0, 0) + ' kPa'], ['Agua', f(best.c.Vw, 2) + ' L'], ['Boquilla', f(best.c.de * 1000, 1) + ' mm'], ['Ángulo', f(best.c.theta, 1) + '°']];
  const optCard = h(Group, { title: 'Modo Optimización', color: '#a3e635' },
    h('p', { className: 'text-sm text-slate-400 mb-3' }, 'Búsqueda Monte Carlo: la primera mitad explora al azar y la segunda refina alrededor del mejor resultado. Optimiza presión, agua, boquilla y ángulo; masa, botella y Cd quedan como están.'),
    h('div', { className: 'flex flex-wrap items-center gap-2 mb-3' },
      h('select', { className: selCls, value: obj, onChange: e => setObj(e.target.value) }, h('option', { value: 'hmax' }, 'Maximizar altura'), h('option', { value: 'range' }, 'Maximizar distancia'), h('option', { value: 'vmax' }, 'Maximizar velocidad máxima')),
      h('label', { className: 'text-sm text-slate-300 flex items-center gap-2' }, 'Iteraciones',
        h('input', { type: 'number', min: 10, max: 1000, step: 10, value: iters, onChange: e => setIters(parseInt(e.target.value) || 0), className: selCls + ' mono w-20 text-right' })),
      h('button', { onClick: runOpt, disabled: opBusy, className: btn + ' bg-lime-500 hover:bg-lime-400 text-slate-900' }, opBusy ? `Buscando ${Math.round(prog * 100)}%` : 'Buscar óptimo')),
    best ? h('div', { className: 'rounded-lg bg-slate-950/60 border border-lime-500/40 p-4' },
      h('div', { className: 'font-bold text-lime-300 mb-2' }, 'Mejor configuración encontrada'),
      h('div', { className: 'grid grid-cols-2 gap-x-4 gap-y-1 mono text-sm mb-3' }, bl.map(([a, b]) => h('div', { key: a, className: 'flex justify-between' }, h('span', { className: 'text-slate-400' }, a), h('span', null, b)))),
      h('div', { className: 'text-slate-300 text-sm' }, (OUTS.find(a => a.k === best.obj).label) + ' alcanzada: ', h('span', { className: 'mono text-xl font-bold text-lime-300' }, f(best.sc, 1) + ' ' + OUTS.find(a => a.k === best.obj).unit)),
      h('button', { onClick: applyBest, className: btn + ' mt-3 border border-lime-500 text-lime-300 hover:bg-lime-500/10 text-sm py-1' }, 'Aplicar al simulador'))
    : h('div', { className: 'text-slate-500 text-sm py-10 text-center' }, 'Aún no hay resultados.'));
  const ts = (k) => r.pts.map(q => ({ x: q.t, y: q[k] }));
  const thrustData = r.pts.filter(q => q.t <= Math.max(r.tBurn * 1.3, 0.05)).map(q => ({ x: q.t, y: q.T }));
  const mini = (title, node) => h('div', { className: 'rounded-xl bg-slate-900/70 p-3' }, h('div', { className: 'text-sm font-bold text-slate-300 mb-1' }, title), node);
  return h('div', { className: 'max-w-6xl mx-auto p-4 md:p-6' },
    h('header', { className: 'mb-5' },
      h('h1', { className: 'text-3xl font-black tracking-tight text-sky-200' }, 'Simulador de cohete de agua'),
      h('p', { className: 'text-slate-400 mt-1 max-w-2xl' }, 'Cambia los parámetros y mira cómo se transforma la trayectoria. Modelo hidrodinámico de Prusa (2000): Bernoulli para el agua, conservación de masa y segunda ley de Newton.')),
    h('div', { className: 'grid lg:grid-cols-[340px_1fr] gap-5' },
      h('div', null,
        h(Group, { title: 'Agua y presión', color: '#38bdf8' },
          h(Slider, { label: 'Volumen de agua (Vw)', unit: 'L', v: p.Vw, min: 0.1, max: 2.0, step: 0.05, set: set('Vw') }),
          h(Slider, { label: 'Presión manométrica inicial (P₀)', unit: 'kPa', v: p.P0, min: 100, max: 400, step: 10, set: set('P0') }),
          r.clamped && h('p', { className: 'text-xs text-amber-300' }, 'El agua ocupa casi toda la botella; se limita al 95 % del volumen para dejar aire.')),
        h(Group, { title: 'Estructura del cohete', color: '#fb923c' },
          h(Slider, { label: 'Volumen total de la botella (Vtot)', unit: 'L', v: p.Vb, min: 1, max: 3, step: 0.25, set: set('Vb') }),
          h(Slider, { label: 'Masa del cohete vacío', unit: 'kg', v: p.m, min: 0.05, max: 0.6, step: 0.01, set: set('m') }),
          h(Slider, { label: 'Diámetro de la botella (Ab, Bernoulli)', unit: 'mm', v: p.D * 1000, min: 60, max: 120, step: 1, set: v => set('D')(v / 1000) }),
          h(Slider, { label: 'Diámetro de la boquilla', unit: 'mm', v: p.de * 1000, min: 5, max: 30, step: 0.5, set: v => set('de')(v / 1000) }),
          h('p', { className: 'text-xs text-slate-400 mb-3 mono' }, `Área de boquilla Ae = ${f(Math.PI * (p.de * 500) ** 2, 1)} mm²`),
          h(Slider, { label: 'Diámetro del cohete (Ac)', unit: 'mm', v: p.Dc * 1000, min: 40, max: 150, set: v => set('Dc')(v / 1000) }),
          h('p', { className: 'text-xs text-slate-400 mb-3 mono' }, `Área transversal Ac = ${f(Math.PI * (p.Dc * 500) ** 2 / 100, 1)} cm²`),
          h(Slider, { label: 'Coeficiente de arrastre (Cd)', unit: '', v: p.cd, min: 0.2, max: 0.9, step: 0.05, set: set('cd') })),
        h(Group, { title: 'Lanzamiento', color: '#a3e635' },
          h(Slider, { label: 'Ángulo de lanzamiento (θ)', unit: '°', v: p.theta, min: 10, max: 90, step: 1, set: set('theta') }),
          h('p', { className: 'text-xs text-slate-400' }, 'Al lanzar, la propulsión se reproduce en cámara lenta.')),
        h('div', { className: 'grid grid-cols-3 gap-2' },
          h('button', { onClick: launch, className: 'col-span-2 rounded-xl bg-orange-500 hover:bg-orange-400 text-slate-900 text-lg font-black py-3 transition-colors focus:outline-none focus:ring-2 focus:ring-white' }, 'Lanzar'),
          h('button', { onClick: reset, className: 'rounded-xl border border-slate-500 text-slate-300 hover:bg-slate-800 font-bold py-3 transition-colors focus:outline-none focus:ring-2 focus:ring-white' }, 'Reiniciar'))),
      h('div', null,
        h('div', { className: 'grid grid-cols-2 md:grid-cols-3 gap-3 mb-4' },
          h(Stat, { label: 'Altura máxima', value: f(r.hmax, 1), unit: 'm', color: '#facc15' }),
          h(Stat, { label: 'Distancia de vuelo', value: f(r.range, 1), unit: 'm', color: '#f87171' }),
          h(Stat, { label: 'Tiempo total de vuelo', value: f(r.tFlight, 2), unit: 's', color: '#38bdf8' }),
          h(Stat, { label: 'Tiempo hasta la altura máxima', value: f(r.tApex, 2), unit: 's', color: '#a3e635' }),
          h(Stat, { label: 'Duración del empuje', value: f(r.tBurn, 3), unit: 's', color: '#fb923c' }),
          h(Stat, { label: 'Velocidad máxima', value: f(r.vmax, 1), unit: 'm/s', color: '#c4b5fd' })),
        h(Chart, { r, tAnim, clk, theta: p.theta }),
        h('div', { className: 'grid md:grid-cols-2 gap-3 mt-4' },
          mini('Altura vs. tiempo', h(Plot, { data: ts('y'), color: '#facc15', xl: 'Tiempo (s)', yl: 'Altura (m)', cursor: tAnim })),
          mini('Velocidad vs. tiempo', h(Plot, { data: ts('v'), color: '#a3e635', xl: 'Tiempo (s)', yl: 'Velocidad (m/s)', cursor: tAnim })),
          mini('Distancia vs. tiempo', h(Plot, { data: ts('x'), color: '#f87171', xl: 'Tiempo (s)', yl: 'Distancia (m)', cursor: tAnim })),
          mini('Empuje vs. tiempo (propulsión)', h(Plot, { data: thrustData, color: '#fb923c', xl: 'Tiempo (s)', yl: 'Empuje (N)', cursor: tAnim }))),
        h('div', { className: 'rounded-xl bg-slate-900/70 p-4 mt-4 text-sm text-slate-300 leading-relaxed' },
          h('h3', { className: 'font-bold text-sky-200 mb-2' }, 'Qué calcula el simulador'),
          h('p', { className: 'mb-2' }, h('b', null, 'Fase 1, propulsión. '), 'El aire se expande de forma adiabática: P = P₀·(Va₀/Va)^γ. Con Bernoulli, la velocidad de salida del agua es ', h('span', { className: 'mono' }, 've = √(2(P − Patm) / (ρ(1 − (Ae/Ab)²)))'), '. El volumen de agua baja según ', h('span', { className: 'mono' }, 'dVw/dt = −Ae·ve'), ' y el empuje es ', h('span', { className: 'mono' }, 'T = ρ·Ae·ve²'), '.'),
          h('p', { className: 'mb-2' }, 'La aceleración sale del balance de fuerzas con masa variable: ', h('span', { className: 'mono' }, 'm(t)·a = T − Fd − m·g'), ', con ', h('span', { className: 'mono' }, 'Fd = ½·ρaire·Cd·Ab·v²'), '.'),
          h('p', null, h('b', null, 'Fase 2, vuelo libre. '), 'Cuando se agota el agua, T = 0 y el cohete sigue como proyectil con peso y arrastre hasta tocar el suelo. Velocidad inicial de salida: ', h('span', { className: 'mono text-sky-300' }, f(r.ve0, 1) + ' m/s'), '; empuje máximo: ', h('span', { className: 'mono text-orange-300' }, f(r.Fmax, 0) + ' N'), '.')))),
    h('div', { className: 'grid lg:grid-cols-2 gap-5 mt-5' }, expCard, optCard));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
